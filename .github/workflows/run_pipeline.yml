name: Run Daily Pipeline

on:
  # Tự động chạy 15:30 ICT (08:30 UTC) mỗi ngày T2-T6
  schedule:
    - cron: "30 8 * * 1-5"

  # Manual trigger từ GitHub Pages button hoặc GitHub UI
  workflow_dispatch:
    inputs:
      run_date:
        description: "Ngày chạy (YYYY-MM-DD). Để trống = hôm nay"
        required: false
        default: ""

env:
  VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "ai/requirements.txt"

      - name: Install dependencies
        run: pip install -r ai/requirements.txt

      - name: Pre-authenticate vnstock
        run: |
          python - <<'EOF'
          import sys, os, json
          from pathlib import Path

          sys.path.insert(0, "ai")

          # Authenticate via vnii
          try:
              from vnii import lc_init
              result = lc_init()
              print("✅ lc_init result:", result)
          except Exception as e:
              print("⚠️  lc_init error:", e)

          # Verify user.json
          user_json = Path.home() / ".vnstock" / "user.json"
          if user_json.exists():
              data = json.loads(user_json.read_text())
              print("📄 user.json:", data)
              if not data.get("user"):
                  # Patch: set user field so idv() passes
                  data["user"] = data.get("email") or data.get("username") or "authenticated"
                  user_json.write_text(json.dumps(data))
                  print("🔧 Patched user.json user field")
          else:
              print("⚠️  user.json not found at", user_json)
              # Create minimal user.json so idv() doesn't crash
              user_json.parent.mkdir(parents=True, exist_ok=True)
              user_json.write_text(json.dumps({"user": "github-actions", "tier": "free"}))
              print("🔧 Created stub user.json")
          EOF

      - name: Resolve run date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "date=${{ github.event.inputs.run_date }}" >> $GITHUB_OUTPUT
          else
            # Vietnam time = UTC+7
            echo "date=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          echo "Running for: $(cat $GITHUB_OUTPUT)"

      - name: Run pipeline
        run: python scheduler/run_daily.py --date ${{ steps.date.outputs.date }}

      - name: Configure git & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: pipeline ${{ steps.date.outputs.date }}"
          git push
