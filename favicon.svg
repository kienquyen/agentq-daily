<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg  { fill: #18181b; }
      .bar { fill: #4ade80; }
      .txt { fill: #f4f4f5; }
    }
    @media (prefers-color-scheme: light) {
      .bg  { fill: #22C55E; }
      .bar { fill: #ffffff; }
      .txt { fill: #ffffff; }
    }
  </style>
  <!-- Rounded square background -->
  <rect class="bg" width="32" height="32" rx="8"/>
  <!-- Stylised signal bars (3 bars ascending — fintech uptrend motif) -->
  <rect class="bar" x="6"  y="20" width="4" height="6"  rx="1.2"/>
  <rect class="bar" x="12" y="15" width="4" height="11" rx="1.2"/>
  <rect class="bar" x="18" y="10" width="4" height="16" rx="1.2"/>
  <!-- Dot accent on top bar -->
  <circle class="bar" cx="20" cy="8.5" r="2"/>
</svg>
