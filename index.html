<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentQ Signal — Tín hiệu giao dịch định lượng HOSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── TOKENS ─────────────────────────────────────────────────────────── */
    :root {
      --bg:          #0F1117;
      --surface:     #151A23;
      --surface2:    #1C2333;
      --border:      rgba(255,255,255,0.07);
      --accent:      #7B61FF;
      --accent-dim:  rgba(123,97,255,0.15);
      --green:       #00F5A0;
      --green-dim:   rgba(0,245,160,0.12);
      --red:         #FF4D6D;
      --red-dim:     rgba(255,77,109,0.12);
      --yellow:      #FFB800;
      --yellow-dim:  rgba(255,184,0,0.12);
      --blue:        #60A5FA;
      --blue-dim:    rgba(96,165,250,0.12);
      --purple:      #C084FC;
      --purple-dim:  rgba(192,132,252,0.12);
      --text:        #E6EAF2;
      --text2:       #A0A7B4;
      --text3:       #5C6478;
      --radius:      12px;
      --radius-sm:   8px;
      --shadow:      0 4px 24px rgba(0,0,0,0.4);
    }
    [data-theme="light"] {
      --bg:       #F0F3FA;
      --surface:  #FFFFFF;
      --surface2: #E8ECF6;
      --border:   rgba(0,0,0,0.08);
      --text:     #1A1D2C;
      --text2:    #5C6478;
      --text3:    #A0A7B4;
      --accent:   #6B50F0;
      --green:    #009962;
      --green-dim:rgba(0,153,98,0.10);
      --red:      #D93055;
      --red-dim:  rgba(217,48,85,0.10);
      --yellow:   #B87D00;
      --yellow-dim:rgba(184,125,0,0.10);
      --blue:     #2563EB;
      --blue-dim: rgba(37,99,235,0.10);
      --shadow:   0 4px 24px rgba(0,0,0,0.08);
    }

    /* ── RESET ───────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background .25s, color .25s;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ── HEADER ──────────────────────────────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 100;
      height: 56px;
      background: rgba(15,17,23,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    [data-theme="light"] .header { background: rgba(240,243,250,0.9); }
    .logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 7px;
      box-shadow: 0 0 16px rgba(123,97,255,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
      letter-spacing: -0.5px;
    }
    .logo-text {
      font-size: 16px; font-weight: 700;
      letter-spacing: -0.4px;
    }
    .logo-text span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .live-dot {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text2);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s infinite;
    }
    .dot.stale { background: var(--yellow); animation: none; }
    @keyframes pulse-dot {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(0,245,160,.4); }
      50%      { opacity:.6; box-shadow: 0 0 0 4px rgba(0,245,160,0); }
    }

    /* Theme toggle */
    .theme-toggle {
      width: 38px; height: 22px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
      position: relative;
      transition: background .25s;
    }
    .theme-toggle::after {
      content: "";
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--text2);
      transition: transform .25s, background .25s;
    }
    [data-theme="light"] .theme-toggle::after {
      transform: translateX(16px);
      background: var(--accent);
    }

    /* ── LAYOUT ──────────────────────────────────────────────────────────── */
    .container {
      max-width: 640px; margin: 0 auto;
      padding: 20px 16px 80px;
    }
    @keyframes fadeIn {
      from { opacity:0; transform: translateY(4px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .animate-in { animation: fadeIn .25s ease both; }

    /* ── DATE NAV ────────────────────────────────────────────────────────── */
    .date-nav {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px;
    }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      transition: background .15s, color .15s, border-color .15s;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--accent-dim);
      border-color: rgba(123,97,255,.35);
      color: var(--accent);
    }
    .nav-btn:disabled { opacity: .35; cursor: default; }
    .date-display {
      flex: 1; text-align: center;
    }
    .date-main {
      font-size: 18px; font-weight: 700;
      letter-spacing: -0.4px;
    }
    .date-sub {
      font-size: 11px; color: var(--text2);
      font-weight: 500; letter-spacing: .4px;
      text-transform: uppercase;
    }

    /* ── REGIME BANNER ───────────────────────────────────────────────────── */
    .regime-banner {
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 12px;
      border: 1px solid;
      position: relative; overflow: hidden;
    }
    .regime-banner.green {
      background: linear-gradient(135deg, rgba(0,245,160,.08), var(--surface) 70%);
      border-color: rgba(0,245,160,.25);
    }
    .regime-banner.red {
      background: linear-gradient(135deg, rgba(255,77,109,.08), var(--surface) 70%);
      border-color: rgba(255,77,109,.25);
    }
    .regime-banner.gray {
      background: var(--surface); border-color: var(--border);
    }
    .regime-left { display: flex; align-items: center; gap: 10px; }
    .regime-icon {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .regime-icon.green { background: rgba(0,245,160,.15); }
    .regime-icon.red   { background: rgba(255,77,109,.15); }
    .regime-label {
      font-size: 13px; font-weight: 700;
      letter-spacing: -0.2px;
    }
    .regime-sub {
      font-size: 10px; color: var(--text2);
      font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
      margin-top: 1px;
    }
    .regime-stats { display: flex; gap: 16px; }
    .regime-stat { text-align: right; }
    .regime-stat-val {
      font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
    }
    .regime-stat-name {
      font-size: 9px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--text3); margin-top: 1px;
    }

    /* 4-Layer Regime Breakdown */
    .regime-breakdown {
      display: flex; gap: 12px; flex: 1; min-width: 280px;
      padding-left: 10px; justify-content: flex-start;
    }
    .breakdown-item {
      text-align: center; flex: 1;
    }
    .breakdown-val {
      font-size: 14px; font-weight: 700; letter-spacing: -0.2px;
      margin-bottom: 2px;
    }
    .breakdown-name {
      font-size: 9px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .6px;
      color: var(--text3);
    }

    /* Regime Score */
    .regime-score {
      font-size: 10px; color: var(--text2);
      font-weight: 600; margin-top: 2px;
      letter-spacing: .4px;
    }

    /* ── SECTION HEADER ──────────────────────────────────────────────────── */
    .section-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--text3);
      margin: 20px 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after {
      content: ""; flex: 1; height: 1px;
      background: var(--border);
    }

    /* ── SIGNAL CARDS ────────────────────────────────────────────────────── */
    .signal-grid {
      display: flex; flex-direction: column; gap: 10px;
    }
    .signal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      position: relative; overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .1s, box-shadow .15s;
    }
    .signal-card::before {
      content: "";
      position: absolute; top:0; left:0; right:0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(123,97,255,.4), transparent);
    }
    .signal-card.buy1::before {
      background: linear-gradient(90deg, transparent, rgba(0,245,160,.5), transparent);
    }
    .signal-card.buy2::before {
      background: linear-gradient(90deg, transparent, rgba(96,165,250,.5), transparent);
    }
    .signal-card.buy3::before {
      background: linear-gradient(90deg, transparent, rgba(255,184,0,.5), transparent);
    }
    .signal-card:hover {
      border-color: rgba(123,97,255,.3);
      box-shadow: 0 4px 20px rgba(123,97,255,.08);
      transform: translateY(-1px);
    }
    .signal-card:active { transform: scale(.99); }

    /* Left accent bar */
    .signal-card .accent-bar {
      position: absolute; left:0; top:12px; bottom:12px;
      width: 3px; border-radius: 0 2px 2px 0;
    }
    .signal-card.buy1 .accent-bar { background: var(--green); }
    .signal-card.buy2 .accent-bar { background: var(--blue); }
    .signal-card.buy3 .accent-bar { background: var(--yellow); }

    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 10px;
      padding-left: 10px;
    }
    .card-ticker {
      font-size: 20px; font-weight: 700;
      letter-spacing: -0.5px;
    }
    .card-price {
      font-size: 13px; color: var(--text2);
      margin-top: 1px; font-weight: 500;
    }
    .card-right { text-align: right; }

    /* Signal type badge */
    .sig-badge {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 3px 9px; border-radius: 20px;
      margin-bottom: 4px;
    }
    .sig-badge.buy1 {
      background: rgba(0,245,160,.12); color: var(--green);
      border: 1px solid rgba(0,245,160,.25);
    }
    .sig-badge.buy2 {
      background: rgba(96,165,250,.12); color: var(--blue);
      border: 1px solid rgba(96,165,250,.25);
    }
    .sig-badge.buy3 {
      background: rgba(255,184,0,.12); color: var(--yellow);
      border: 1px solid rgba(255,184,0,.25);
    }

    /* Hold period badge */
    .hold-badge {
      display: inline-block;
      font-size: 10px; font-weight: 600;
      padding: 4px 8px; border-radius: 4px;
      background: rgba(192,132,252,.12); color: var(--purple);
      border: 1px solid rgba(192,132,252,.25);
      margin-left: 6px;
      white-space: nowrap;
    }

    /* Strength */
    .strength-row {
      display: flex; align-items: center; gap: 8px;
      padding-left: 10px; margin-bottom: 8px;
    }
    .strength-track {
      flex: 1; height: 4px;
      background: var(--surface2); border-radius: 2px; overflow: hidden;
    }
    .strength-fill {
      height: 100%; border-radius: 2px;
      transition: width .6s cubic-bezier(.4,0,.2,1);
    }
    .strength-fill.high {
      background: linear-gradient(90deg, var(--green), #00c080);
    }
    .strength-fill.mid {
      background: linear-gradient(90deg, var(--accent), #A78BFF);
    }
    .strength-fill.low {
      background: linear-gradient(90deg, var(--yellow), #ffd060);
    }
    .strength-val {
      font-size: 13px; font-weight: 700;
      min-width: 28px; text-align: right;
      letter-spacing: -0.3px;
    }
    .strength-val.high { color: var(--green); }
    .strength-val.mid  { color: var(--accent); }
    .strength-val.low  { color: var(--yellow); }

    /* Reasons */
    .card-reasons {
      font-size: 11px; color: var(--text2);
      line-height: 1.6; padding-left: 10px;
    }
    .reason-pos { color: var(--green); font-weight: 600; }
    .reason-neg { color: var(--red);   font-weight: 600; }

    /* ── HISTORY TABLE ───────────────────────────────────────────────────── */
    .history-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 8px;
    }
    .history-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-head-title {
      font-size: 12px; font-weight: 600;
      letter-spacing: -0.2px;
    }
    .history-count {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .6px;
      color: var(--text3);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 9px 16px;
      font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--text3);
      text-align: left;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody tr.row-active { background: var(--accent-dim); }
    td {
      padding: 10px 16px;
      font-size: 12px; font-weight: 500;
      vertical-align: middle;
    }
    td.td-date {
      font-size: 12px; font-weight: 700;
      color: var(--accent); letter-spacing: -0.2px;
      white-space: nowrap;
    }
    td.td-regime-green { color: var(--green); font-weight: 600; }
    td.td-regime-red   { color: var(--red);   font-weight: 600; }

    /* Pills in history */
    .pill {
      display: inline-block;
      padding: 2px 7px; border-radius: 20px;
      font-size: 10px; font-weight: 700;
      letter-spacing: .3px; margin: 1px 2px;
    }
    .pill.buy1 { background: rgba(0,245,160,.12);  color: var(--green);  }
    .pill.buy2 { background: rgba(96,165,250,.12); color: var(--blue);   }
    .pill.buy3 { background: rgba(255,184,0,.12);  color: var(--yellow); }

    /* ── EMPTY STATE ─────────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 56px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    .empty-icon {
      width: 56px; height: 56px;
      background: var(--surface2);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin: 0 auto 16px;
    }
    .empty-title {
      font-size: 15px; font-weight: 700;
      letter-spacing: -0.3px; margin-bottom: 6px;
    }
    .empty-sub { color: var(--text2); font-size: 12px; }

    /* ── LOADING ─────────────────────────────────────────────────────────── */
    .loading { padding: 60px 20px; text-align: center; color: var(--text2); }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 14px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ──────────────────────────────────────────────────────────── */
    .footer {
      text-align: center; color: var(--text3);
      font-size: 10px; font-weight: 500;
      letter-spacing: .3px;
      padding: 32px 16px 20px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    /* ── TAB BAR ─────────────────────────────────────────────────────────── */
    .tab-bar {
      position: sticky; top: 56px; z-index: 90;
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; overflow-x: auto;
      scrollbar-width: none;
      padding: 0 16px;
    }
    [data-theme="light"] .tab-bar { background: rgba(240,243,250,0.95); }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      color: var(--text2);
      background: none; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .tab-btn:hover  { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── AI MODEL CARDS ─────────────────────────────────────────────────── */
    .model-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .model-title {
      font-size: 15px; font-weight: 700;
      letter-spacing: -0.3px; margin-bottom: 4px;
    }
    .model-desc { font-size: 11px; color: var(--text2); margin-bottom: 14px; }
    .stat-strip {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1px; border-radius: var(--radius-sm);
      overflow: hidden; border: 1px solid var(--border);
    }
    .stat-cell {
      background: var(--surface2);
      padding: 12px 10px; text-align: center;
    }
    .stat-val {
      font-size: 18px; font-weight: 700;
      letter-spacing: -0.4px; line-height: 1.2;
    }
    .stat-lbl {
      font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .7px;
      color: var(--text3); margin-top: 2px;
    }

    /* AI Signal row cards */
    .ai-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      position: relative; overflow: hidden;
      transition: border-color .15s;
    }
    .ai-card::before {
      content: ""; position: absolute;
      top:0; left:0; right:0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(123,97,255,.5), transparent);
    }
    .ai-card.win::before  { background: linear-gradient(90deg, transparent, rgba(0,245,160,.5), transparent); }
    .ai-card.loss::before { background: linear-gradient(90deg, transparent, rgba(255,77,109,.5), transparent); }
    .ai-card.pending::before { background: linear-gradient(90deg, transparent, rgba(123,97,255,.5), transparent); }
    .ai-card:hover { border-color: rgba(123,97,255,.3); }

    .ai-card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 10px;
    }
    .ai-ticker { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; }
    .ai-date   { font-size: 11px; color: var(--text2); margin-top: 2px; }

    .status-badge {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 3px 9px; border-radius: 20px;
    }
    .status-badge.win     { background: rgba(0,245,160,.12); color: var(--green);  border: 1px solid rgba(0,245,160,.25); }
    .status-badge.loss    { background: rgba(255,77,109,.10); color: var(--red);    border: 1px solid rgba(255,77,109,.22); }
    .status-badge.pending { background: rgba(123,97,255,.12); color: var(--accent); border: 1px solid rgba(123,97,255,.22); }

    .ai-metrics {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .ai-metric { text-align: center; }
    .ai-metric-val {
      font-size: 13px; font-weight: 700;
      letter-spacing: -0.3px;
    }
    .ai-metric-lbl {
      font-size: 9px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .6px;
      color: var(--text3); margin-top: 1px;
    }
    .return-pos { color: var(--green); }
    .return-neg { color: var(--red); }
    .return-nil { color: var(--text2); }

    /* AI insight glow card */
    .ai-insight {
      background: linear-gradient(135deg, rgba(123,97,255,.1), rgba(123,97,255,.04));
      border: 1px solid rgba(123,97,255,.25);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex; gap: 12px; align-items: flex-start;
      margin-bottom: 16px;
    }
    .ai-insight-icon {
      width: 32px; height: 32px; flex-shrink: 0;

<!-- ── SCRIPT ─────────────────────────────────────────────────────────────── -->
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const GITHUB_USER = "kienquyen";
const GITHUB_REPO = "agentq-daily";
const CACHE_BUST = "v" + Math.random().toString(36).slice(2, 8); // Random cache bust every load
// Local dev: dùng relative path; Production: dùng CDN
const IS_LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
const CDN      = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@main`;
const DATA_URL  = IS_LOCAL ? "./data.json"     : `${CDN}/data.json?cb=${CACHE_BUST}`;
const V3A_URL   = IS_LOCAL ? "./v3a_data.json" : `${CDN}/v3a_data.json?cb=${CACHE_BUST}`;
const V5_URL    = IS_LOCAL ? "./v5_data.json"  : `${CDN}/v5_data.json?cb=${CACHE_BUST}`;

// ── State ─────────────────────────────────────────────────────────────────────
let allDates  = [];
let cache     = {};
let current   = null;
let activeTab = "rules";
let v3aData   = null;
let v5Data    = null;
let lastDataHash = null; // Track for auto-refresh

// ── Theme ─────────────────────────────────────────────────────────────────────
const themeBtn = document.getElementById("themeToggle");
let isDark = true;
themeBtn.addEventListener("click", () => {
  isDark = !isDark;
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
});

// ── Helpers ───────────────────────────────────────────────────────────────────
const WEEKDAYS = ["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];

// Simple hash function for comparing data
function hashCode(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    const char = s.charCodeAt(i);
    h = ((h << 5) - h) + char;
    h = h & h; // Convert to 32bit integer
  }
  return Math.abs(h).toString(36);
}

function formatDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("vi-VN", {day:"2-digit",month:"2-digit",year:"numeric"});
}
function getWeekday(d) { return WEEKDAYS[new Date(d+"T00:00:00").getDay()]; }
function timeAgo(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1)    return "vừa cập nhật";
  if (m < 60)   return `${m} phút trước`;
  if (m < 1440) return `${Math.floor(m/60)} giờ trước`;
  return `${Math.floor(m/1440)} ngày trước`;
}
function strClass(s) {
  return s >= 75 ? "high" : s >= 60 ? "mid" : "low";
}
function strIcon(s) {
  return s >= 85 ? "🔥" : s >= 75 ? "●" : s >= 60 ? "●" : "●";
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function loadAllData() {
  try {
    const r = await fetch(`${DATA_URL}?t=${Date.now()}`);
    if (!r.ok) throw new Error(r.status);
    cache = await r.json();
    return Object.keys(cache).sort((a,b) => b.localeCompare(a));
  } catch(e) {
    console.error("loadAllData error:", e);
    return [];
  }
}
async function fetchSignal(date) { return cache[date] || null; }

// ── Render: Regime Banner ────────────────────────────────────────────────────
function renderRegime(regime) {
  if (!regime) return `<div class="regime-banner gray"><div class="regime-left"><div class="regime-icon">📡</div><div><div class="regime-label">Không có dữ liệu Regime</div></div></div></div>`;

  // Parse detail string to extract 4-layer breakdown
  const detail = regime.detail || "";
  const lines = detail.split("\n");

  // Extract regime icon and label (e.g., "🟢 TREND" or "🔴 GIẢM")
  const regimeLine = lines[0] || "";
  const regimeMatch = regimeLine.match(/([🟢🔴🟡]) (\*\*)?([^*\n]+)(\*\*)?/);
  const regimeIcon = regimeMatch ? regimeMatch[1] : (regime.ok ? "🟢" : "🔴");
  const regimeLabel = regimeMatch ? regimeMatch[3].trim() : (regime.ok ? "TREND" : "CHOP");

  // Extract score and regime classification (e.g., "🔴 **GIẢM** (Score 24/100)")
  const scoreLine = lines[1] || "";
  const scoreMatch = scoreLine.match(/Score (\d+)/);
  const score = scoreMatch ? parseInt(scoreMatch[1]) : 50;

  // Determine regime class for styling
  let regimeCls = "ranging";
  if (score >= 75) regimeCls = "strong-bull";
  else if (score >= 60) regimeCls = "bull";
  else if (score >= 45) regimeCls = "recovery";
  else if (score >= 30) regimeCls = "ranging";
  else regimeCls = "bear-risk";

  // Extract 4-layer breakdown (e.g., "Trend 0.28 · Breadth 0.23 · Flow 0.50 · Vol 0.52")
  const breakdownLine = lines[2] || "";
  const breakdownMatch = breakdownLine.match(/Trend ([\d.]+) · Breadth ([\d.]+) · Flow ([\d.]+) · Vol ([\d.]+)/);

  let breakdownHtml = "";
  if (breakdownMatch) {
    const trend = parseFloat(breakdownMatch[1]);
    const breadth = parseFloat(breakdownMatch[2]);
    const flow = parseFloat(breakdownMatch[3]);
    const vol = parseFloat(breakdownMatch[4]);

    const scoreToColor = (s) => {
      if (s >= 0.75) return "color:var(--green)";
      if (s >= 0.6) return "color:var(--blue)";
      if (s >= 0.45) return "color:var(--purple)";
      return "color:var(--yellow)";
    };

    breakdownHtml = `
      <div class="regime-breakdown">
        <div class="breakdown-item">
          <div class="breakdown-val" style="${scoreToColor(trend)}">${(trend*100).toFixed(0)}</div>
          <div class="breakdown-name">Trend</div>
        </div>
        <div class="breakdown-item">
          <div class="breakdown-val" style="${scoreToColor(breadth)}">${(breadth*100).toFixed(0)}</div>
          <div class="breakdown-name">Breadth</div>
        </div>
        <div class="breakdown-item">
          <div class="breakdown-val" style="${scoreToColor(flow)}">${(flow*100).toFixed(0)}</div>
          <div class="breakdown-name">Flow</div>
        </div>
        <div class="breakdown-item">
          <div class="breakdown-val" style="${scoreToColor(vol)}">${(vol*100).toFixed(0)}</div>
          <div class="breakdown-name">Vol</div>
        </div>
      </div>`;
  }

  const ok = regime.ok;
  const cls = ok ? "green" : "red";

  return `
    <div class="regime-banner ${cls} regime-${regimeCls} animate-in">
      <div class="regime-left">
        <div class="regime-icon">${regimeIcon}</div>
        <div>
          <div class="regime-label">${regimeLabel}</div>
          <div class="regime-score">Score: ${score}/100</div>
        </div>
      </div>
      ${breakdownHtml}
    </div>`;
}

// ── Render: Signal Card ───────────────────────────────────────────────────────
function renderCard(s) {
  const type  = s.signal_type.toLowerCase();
  const sc    = s.strength;
  const scC   = strClass(sc);
  const holdDays = s.hold_days || 15;  // Default 15d if not specified
  const reasons = (s.reasons || []).map(r => {
    const isPos = r.startsWith("+");
    const cls   = isPos ? "reason-pos" : "reason-neg";
    const parts = r.split(" ");
    return `<span class="${cls}">${parts[0]}</span> ${parts.slice(1).join(" ")}`;
  }).join(" &nbsp;·&nbsp; ");

  return `
    <div class="signal-card ${type} animate-in">
      <div class="accent-bar"></div>
      <div class="card-top">
        <div>
          <div class="card-ticker">${s.symbol}</div>
          <div class="card-price">${s.entry_price.toFixed(1)} <span style="color:var(--text3)">k VND</span></div>
        </div>
        <div class="card-right">
          <div class="sig-badge ${type}">${s.signal_type}</div>
          <div class="hold-badge" title="Recommended hold period">${holdDays}d</div>
        </div>
      </div>
      <div class="strength-row">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);min-width:40px">Score</div>
        <div class="strength-track">
          <div class="strength-fill ${scC}" style="width:${Math.min(sc,100)}%"></div>
        </div>
        <div class="strength-val ${scC}">${sc}</div>
      </div>
      ${reasons ? `<div class="card-reasons">${reasons}</div>` : ""}
    </div>`;
}

// ── Render: Signals section ───────────────────────────────────────────────────
function renderSignals(data) {
  if (!data?.signals?.length) {
    return `
      <div class="empty animate-in">
        <div class="empty-icon">📭</div>
        <div class="empty-title">Không có tín hiệu hôm nay</div>
        <div class="empty-sub">Thị trường chưa có setup phù hợp điều kiện lọc</div>
      </div>`;
  }
  const buy1 = data.signals.filter(s => s.signal_type==="BUY1");
  const buy2 = data.signals.filter(s => s.signal_type==="BUY2");
  const buy3 = data.signals.filter(s => s.signal_type==="BUY3");
  let html = "";

  if (buy1.length) html += `
    <div class="section-label">Xu hướng tăng BUY1 (${buy1.length})</div>
    <div class="signal-grid">${buy1.map(renderCard).join("")}</div>`;
  if (buy2.length) html += `
    <div class="section-label">Hồi phục quá bán BUY2 (${buy2.length})</div>
    <div class="signal-grid">${buy2.map(renderCard).join("")}</div>`;
  if (buy3.length) html += `
    <div class="section-label">Cực kỳ quá bán BUY3 (${buy3.length})</div>
    <div class="signal-grid">${buy3.map(renderCard).join("")}</div>`;
  return html;
}

// ── Render: History table ─────────────────────────────────────────────────────
function renderHistory() {
  if (!allDates.length) return "";
  const rows = allDates.slice(0,30).map(d => {
    const data   = cache[d];
    const sigs   = data?.signals || [];
    const b1     = sigs.filter(s=>s.signal_type==="BUY1");
    const b2     = sigs.filter(s=>s.signal_type==="BUY2");
    const b3     = sigs.filter(s=>s.signal_type==="BUY3");
    const reg    = data?.regime;
    const regTxt = reg ? (reg.ok ? "🟢 TREND" : "🔴 CHOP") : "—";
    const regCls = reg ? (reg.ok ? "td-regime-green" : "td-regime-red") : "";
    const pills  = [
      ...b1.map(s=>`<span class="pill buy1">${s.symbol} ${s.strength}</span>`),
      ...b2.map(s=>`<span class="pill buy2">${s.symbol} ${s.strength}</span>`),
      ...b3.map(s=>`<span class="pill buy3">${s.symbol} ${s.strength}</span>`),
    ].join("") || `<span style="color:var(--text3)">—</span>`;
    const active = d === current ? " row-active" : "";
    return `<tr class="${active}" onclick="selectDate('${d}')">
      <td class="td-date">${formatDate(d)}</td>
      <td class="${regCls} td-hide">${regTxt}</td>
      <td style="font-weight:700;color:var(--text)">${b1.length+b2.length+b3.length}</td>
      <td>${pills}</td>
    </tr>`;
  }).join("");

  return `
    <div class="section-label">Lịch sử tín hiệu</div>
    <div class="history-wrap animate-in">
      <div class="history-head">
        <span class="history-head-title">30 phiên gần nhất</span>
        <span class="history-count">${allDates.length} phiên</span>
      </div>
      <table>
        <thead><tr>
          <th>Ngày</th>
          <th class="td-hide">Regime</th>
          <th>Tín hiệu</th>
          <th>Chi tiết</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── Render full page ──────────────────────────────────────────────────────────
async function renderPage(date, data) {
  const idx   = allDates.indexOf(date);
  const html = `
    <div class="date-nav">
      <button class="nav-btn" onclick="goDate(-1)" ${idx>=allDates.length-1?"disabled":""}>← Trước</button>
      <div class="date-display">
        <div class="date-main">${formatDate(date)}</div>
        <div class="date-sub">${getWeekday(date)}</div>
      </div>
      <button class="nav-btn" onclick="goDate(1)" ${idx<=0?"disabled":""}>Sau →</button>
    </div>
    ${renderRegime(data?.regime)}
    ${renderSignals(data)}
    ${renderHistory()}
  `;
  document.getElementById("app").innerHTML = html;

  // Update header
  const dot = document.getElementById("statusDot");
  const txt = document.getElementById("lastUpdateText");
  if (data?.generated_at) {
    const stale = (Date.now() - new Date(data.generated_at)) > 26*3600*1000;
    txt.textContent = timeAgo(data.generated_at);
    dot.className   = stale ? "dot stale" : "dot";
  } else {
    txt.textContent = "Chưa có dữ liệu";
    dot.className   = "dot stale";
  }
}

// ── Navigation ────────────────────────────────────────────────────────────────
async function selectDate(date) {
  current = date;
  const data = await fetchSignal(date);
  await renderPage(date, data);
  // Scroll to top smoothly
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function goDate(dir) {
  const idx  = allDates.indexOf(current);
  const next = allDates[idx - dir];
  if (next) selectDate(next);
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft")  goDate(-1);
  if (e.key === "ArrowRight") goDate(1);
});

// ── Init ──────────────────────────────────────────────────────────────────────
// ── Tab switching ─────────────────────────────────────────────────────────────
async function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`tab-${tab}`).classList.add("active");
  if (tab === "rules") {
    if (current) await renderPage(current, await fetchSignal(current));
    else if (allDates.length) await selectDate(allDates[0]);
  } else {
    await renderAITab(tab);
  }
}

// ── AI helpers ────────────────────────────────────────────────────────────────
function fmtPrice(p) {
  if (p == null) return "—";
  return p >= 1000 ? (p/1000).toFixed(1)+"k" : p.toLocaleString("vi-VN");
}
function fmtReturn(r) {
  if (r == null) return `<span style="color:var(--text3)">—</span>`;
  const cls = r > 0 ? "color:var(--green)" : r < 0 ? "color:var(--red)" : "color:var(--text2)";
  return `<span style="${cls};font-weight:700">${r > 0 ? "+" : ""}${r.toFixed(2)}%</span>`;
}
function fmtProb(p) { return p != null ? (p*100).toFixed(1)+"%" : "—"; }

function renderStatStrip(st) {
  if (!st) return "";
  const wr  = st.win_rate ?? 0;
  const avg = st.avg_return ?? 0;
  const wrColor  = wr >= 60 ? "var(--green)" : wr >= 50 ? "var(--text)" : "var(--red)";
  const avgColor = avg > 0 ? "var(--green)" : avg < 0 ? "var(--red)" : "var(--text)";
  return `<div class="stat-strip">
    <div class="stat-cell"><div class="stat-val">${st.total??0}</div><div class="stat-lbl">Tổng lệnh</div></div>
    <div class="stat-cell"><div class="stat-val" style="color:${wrColor}">${wr}%</div><div class="stat-lbl">Win Rate</div></div>
    <div class="stat-cell"><div class="stat-val" style="color:${avgColor}">${avg>0?"+":""}${avg}%</div><div class="stat-lbl">Avg Return</div></div>
    <div class="stat-cell"><div class="stat-val" style="color:var(--green)">+${st.best??0}%</div><div class="stat-lbl">Best Trade</div></div>
  </div>`;
}

function renderAICard(s) {
  const isPending = s.status !== "completed";
  const status    = isPending ? "pending" : (s.is_win ? "win" : "loss");
  const lbl       = isPending ? "ĐANG MỞ" : (s.is_win ? "THẮNG" : "THUA");
  const regime    = s.regime ? `<span style="font-size:10px;color:var(--text3);margin-left:6px;text-transform:uppercase">${s.regime}</span>` : "";
  return `<div class="ai-card ${status} animate-in">
    <div class="ai-card-top">
      <div>
        <div class="ai-ticker">${s.symbol}${regime}</div>
        <div class="ai-date">Vào ${s.signal_date||"—"}</div>
      </div>
      <span class="status-badge ${status}">${lbl}</span>
    </div>
    <div class="ai-metrics">
      <div class="ai-metric"><div class="ai-metric-val">${fmtPrice(s.entry_price)}</div><div class="ai-metric-lbl">GIÁ VÀO</div></div>
      <div class="ai-metric"><div class="ai-metric-val" style="color:var(--accent)">${fmtProb(s.prob)}</div><div class="ai-metric-lbl">XÁC SUẤT</div></div>
      <div class="ai-metric"><div class="ai-metric-val">${s.exit_date||"—"}</div><div class="ai-metric-lbl">NGÀY RA</div></div>
      <div class="ai-metric"><div class="ai-metric-val">${fmtReturn(s.actual_return)}</div><div class="ai-metric-lbl">RETURN</div></div>
    </div>
  </div>`;
}

async function renderAITab(model) {
  document.getElementById("app").innerHTML = `<div class="loading"><div class="spinner"></div><div style="font-size:12px">Đang tải dữ liệu AI...</div></div>`;

  // Load data
  if (model === "v3a" && !v3aData) {
    try { const r = await fetch(`${V3A_URL}?t=${Date.now()}`); v3aData = await r.json(); } catch(e){}
  }
  if (model === "v5" && !v5Data) {
    try { const r = await fetch(`${V5_URL}?t=${Date.now()}`); v5Data = await r.json(); } catch(e){}
  }
  const data = model === "v3a" ? v3aData : v5Data;

  if (!data) {
    document.getElementById("app").innerHTML = `<div class="empty animate-in"><div class="empty-icon">⚠️</div><div class="empty-title">Không tải được dữ liệu</div><div class="empty-sub">Chạy export_ai_signals.py để cập nhật</div></div>`;
    return;
  }

  if (data.generated_at) {
    document.getElementById("lastUpdateText").textContent = timeAgo(data.generated_at);
    document.getElementById("statusDot").className = "dot";
  }

  const active  = data.active_signals  || [];
  const history = data.recent_history  || [];
  const daily   = data.daily_signals   || [];

  let html = `<div class="model-header animate-in">
    <div class="ai-insight">
      <div class="ai-insight-icon">🤖</div>
      <div class="ai-insight-text"><strong>${data.name}</strong><br>${data.description}</div>
    </div>
    ${renderStatStrip(data.stats)}
  </div>`;

  // Active positions
  html += `<div class="section-label">Vị thế đang mở (${active.length})</div>`;
  if (active.length) {
    html += `<div class="signal-grid">${active.map(renderAICard).join("")}</div>`;
  } else {
    html += `<div class="empty animate-in" style="padding:20px 16px"><div class="empty-sub">Không có vị thế mở — chờ signal tiếp theo từ model</div></div>`;
  }

  // Daily signals (v3a shadow signals)
  if (daily.length) {
    html += `<div class="section-label">Các phiên model có tín hiệu</div>`;
    for (const day of daily.slice(0,5)) {
      const cutoff = day.prob_cutoff ? ` · cutoff ${(day.prob_cutoff*100).toFixed(0)}%` : "";
      html += `<div style="font-size:11px;color:var(--text2);margin:8px 0 6px;font-weight:600">${day.date} — ${day.n_signals} tín hiệu${cutoff}</div>
               <div class="signal-grid">${(day.signals||[]).map(s => renderAICard({
                  symbol: s.symbol, signal_date: day.date,
                  entry_price: s.close_vnd||null, prob: s.prob,
                  regime: day.regime||"", status: "completed",
                  is_win: null, actual_return: null, exit_date: null
               })).join("")}</div>`;
    }
  }

  // History table
  if (history.length) {
    const hasAlpha = history.some(s => s.alpha != null);
    const rows = history.map(s => {
      const isPending = s.status !== "completed";
      const status = isPending ? "pending" : (s.is_win ? "win" : "loss");
      const lbl    = isPending ? "MỞ" : (s.is_win ? "THẮNG" : "THUA");
      const alphaCell = hasAlpha
        ? `<td>${fmtReturn(s.alpha)}</td>`
        : "";
      return `<tr>
        <td class="td-date">${s.signal_date}</td>
        <td style="font-weight:700">${s.symbol}</td>
        <td style="color:var(--text2)">${fmtPrice(s.entry_price)}</td>
        <td><span class="status-badge ${status}">${lbl}</span></td>
        <td>${fmtReturn(s.actual_return)}</td>
        ${alphaCell}
        <td class="td-hide" style="color:var(--text3);font-size:11px;text-transform:uppercase">${s.regime||"—"}</td>
      </tr>`;
    }).join("");
    const alphaHeader = hasAlpha ? `<th>Alpha</th>` : "";
    html += `<div class="section-label">Lịch sử giao dịch (20 gần nhất)</div>
      <div class="history-wrap animate-in">
        <div class="history-head">
          <span class="history-head-title">Giao dịch đã hoàn tất</span>
          <span class="history-count">${data.stats?.total||0} tổng</span>
        </div>
        <table>
          <thead><tr><th>Ngày</th><th>Mã</th><th>Giá vào</th><th>Kết quả</th><th>Return</th>${alphaHeader}<th class="td-hide">Regime</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  document.getElementById("app").innerHTML = html;
}

// ── Auto-Refresh ──────────────────────────────────────────────────────────────
async function checkForUpdates() {
  try {
    const r = await fetch(`${DATA_URL}&t=${Date.now()}`);
    if (!r.ok) return;
    const data = await r.text();
    const hash = hashCode(data);

    if (lastDataHash && lastDataHash !== hash) {
      // Data changed! Reload page
      console.log("📡 Phát hiện signal mới — đang refresh...");
      setTimeout(() => location.reload(), 1000);
    } else if (!lastDataHash) {
      lastDataHash = hash; // First load
    }
  } catch(e) {
    console.debug("checkForUpdates error:", e.message);
  }
}

// Start polling every 60 minutes
function startAutoRefresh() {
  // Initial check after 1 minute
  setTimeout(checkForUpdates, 60000);
  // Then every 60 minutes
  setInterval(checkForUpdates, 60 * 60000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  allDates = await loadAllData();
  if (!allDates.length) {
    document.getElementById("app").innerHTML = `
      <div class="empty animate-in">
        <div class="empty-icon">🚀</div>
        <div class="empty-title">Chưa có dữ liệu</div>
        <div class="empty-sub">Bot chưa chạy lần nào, hoặc repo chưa có file data.json</div>
      </div>`;
    document.getElementById("lastUpdateText").textContent = "Chưa có dữ liệu";
    return;
  }
  await selectDate(allDates[0]);
  startAutoRefresh(); // Begin polling for updates
}

// Load and render on page load
init();
</script>
